name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    name: 打包 VSIX
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 语法检查
        run: |
          set -euo pipefail
          for f in src/*.js scripts/*.mjs; do
            node --check "$f"
          done

      - name: 打包
        id: pack
        run: |
          set -euo pipefail
          node scripts/pack-vsix.mjs
          vsix="$(ls -1 ./*.vsix | head -n1)"
          test -n "$vsix"
          echo "vsix=$vsix" >> "$GITHUB_OUTPUT"
          ls -lh "$vsix"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dotoj-vsix
          path: ${{ steps.pack.outputs.vsix }}
          if-no-files-found: error

      - name: 校验 tag 与版本号一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag v$tag 与 package.json 的 $version 不一致"
            exit 1
          fi

      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pack.outputs.vsix }}
          generate_release_notes: true